name: SuccessMetrics quality gates
description: >-
  Run the SuccessMetrics Salesforce quality gates against this repository.
  Rules come from sm-agent-core at run time; the checks run here, against
  your metadata. Generated by sm-agent-core/scripts/publish_tools.py for
  release tools-0.1.0-0.2.0-0.1.0.

inputs:
  api-key:
    description: Your sm-agent-core engagement key. Pass a secret, never a literal.
    required: true
  base-url:
    description: sm-agent-core base URL
    required: false
    default: https://agents.successmetrics.io
  working-directory:
    description: >-
      Where to start discovery. Only needed for a monorepo holding several
      Salesforce projects; otherwise discovery walks up to sfdx-project.json.
    required: false
    default: "."
  max-severity:
    description: What blocks the build — `critical` (default) or `warn`
    required: false
    default: critical
  allow-no-metadata:
    description: Exit 0 instead of 2 when there is no Salesforce metadata to check.
    required: false
    default: "false"

outputs:
  exit-code:
    description: 0 clean, 1 blocked by findings, 2 the gate could not run
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install sm-gates (pinned release tools-0.1.0-0.2.0-0.1.0)
      shell: bash
      run: pip install --quiet "sm-gates @ https://github.com/successmetrics/plugins/releases/download/tools-0.1.0-0.2.0-0.1.0/sm_gates-0.1.0-py3-none-any.whl"

    - name: Run the gates
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SM_API_KEY: ${{ inputs.api-key }}
        SM_BASE_URL: ${{ inputs.base-url }}
      run: |
        set +e
        flags="--format github --max-severity ${{ inputs.max-severity }}"
        if [ "${{ inputs.allow-no-metadata }}" = "true" ]; then
          flags="$flags --allow-no-metadata"
        fi
        sm-gates run $flags
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code
